[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
via_ir = true
optimizer = true
optimizer_runs = 20000
fuzz = { runs = 10000 }
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.ci]
fuzz = { runs = 50000 }
invariant = { runs = 5000, depth = 500 }

[invariant]
runs = 1000
depth = 200
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
